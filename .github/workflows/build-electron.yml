name: Build Electron

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: electron-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows
            os: windows-latest
            command: pnpm dist:win
          - name: macOS x64 and arm64
            platform: macos
            os: macos-latest
            command: pnpm dist:mac
          - name: Linux x64
            platform: linux
            os: ubuntu-latest
            command: pnpm dist:linux

    env:
      # 构建未签名的 macOS 包；配置证书后可移除此项并接入签名/公证。
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: ${{ matrix.command }}

      - name: Upload Windows portable EXE
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          path: out/*-win-x64-portable.exe
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload macOS x64 DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: out/*-mac-x64.dmg
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload macOS arm64 DMG
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: out/*-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload macOS x64 ZIP
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: out/*-mac-x64.zip
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload macOS arm64 ZIP
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v7
        with:
          path: out/*-mac-arm64.zip
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload Linux AppImage
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: out/*.AppImage
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload Linux DEB
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: out/*.deb
          if-no-files-found: error
          retention-days: 14
          archive: false

      - name: Upload Linux RPM
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          path: out/*.rpm
          if-no-files-found: error
          retention-days: 14
          archive: false

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
